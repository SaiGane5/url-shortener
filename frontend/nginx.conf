# Serves the built React SPA. Sits behind the main load balancer
# (../nginx/nginx.conf), which forwards everything that is not an API path here.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bounded by the edge proxy anyway; keeps this server from buffering.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # -------------------------------------------------------- security ---
    # This server DOES return an HTML document, so unlike the API it needs a
    # policy that permits its own bundle. It stays tight:
    #   script-src 'self'          -- only our bundle; no inline <script>, so an
    #                                 injected <script> tag cannot execute
    #   connect-src 'self'         -- XHR only back to our own origin
    #   style-src 'self' 'unsafe-inline'
    #                              -- React inlines a handful of styles; the CSS
    #                                 itself is a static file we control
    #   frame-ancestors 'none'     -- cannot be embedded, so clickjacking a
    #                                 shortened link is not possible
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --------------------------------------------------------- caching ---
    # Vite emits content-hashed filenames, so bundles are safe to cache
    # forever. index.html must NOT be cached, or a returning visitor keeps
    # loading a stale document that references deleted asset hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA history fallback: client-side routes such as /urls/aB3xY7z have no
    # file on disk and must be served index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
