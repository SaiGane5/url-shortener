###############################################################################
# Nginx -- load balancer and single public entrypoint.
#
# Everything the outside world touches comes through here:
#
#   /                     -> frontend container (React SPA)
#   /urls/<code>          -> frontend container (SPA route, has a slash)
#   /api/...              -> api-1 | api-2  (round robin)
#   /docs /redoc          -> api-1 | api-2  (OpenAPI UI)
#   /health /ready        -> api-1 | api-2
#   /metrics              -> api-1 | api-2  (private networks only)
#   /<code>               -> api-1 | api-2  (the redirect hot path)
#
# The trick that makes a single origin work for both the SPA and the redirect
# catch-all is location priority: exact (`=`) and prefix-preferred (`^~`)
# locations are matched BEFORE regex locations, so `/docs` reaches the API even
# though it also matches the short-code pattern.
###############################################################################

user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Prefer a caller-supplied request id so a trace spans client -> nginx ->
    # app; fall back to nginx's own per-request id.
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # `served_by` is echoed by the app (X-Served-By) and logged here as
    # upstream_addr, which is how docs/TESTING.md proves load balancing.
    log_format json_combined escape=json
        '{'
          '"timestamp":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"request_method":"$request_method",'
          '"request_uri":"$request_uri",'
          '"status":$status,'
          '"request_time":$request_time,'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_response_time":"$upstream_response_time",'
          '"upstream_status":"$upstream_status",'
          '"request_id":"$req_id",'
          '"bytes_sent":$body_bytes_sent'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;          # do not advertise the nginx version

    # Matches MAX_REQUEST_BODY_BYTES in the app, so an oversized body is
    # rejected at the edge instead of being proxied only to be rejected again.
    client_max_body_size 16k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               application/xml image/svg+xml;

    ###########################################################################
    # Upstreams
    #
    # Round robin (the default) rather than least_conn, deliberately: with two
    # equally sized replicas and uniformly cheap requests it distributes evenly
    # AND predictably, which makes "did both replicas serve traffic?" a
    # one-command check instead of a statistical argument.
    #
    # max_fails/fail_timeout give passive health checking: two consecutive
    # failures take a replica out of rotation for 10s, which is what makes
    # `docker compose stop api-2` a non-event for clients (see the failure
    # tests in docs/TESTING.md).
    ###########################################################################
    upstream api_backend {
        server api-1:8000 max_fails=2 fail_timeout=10s;
        server api-2:8000 max_fails=2 fail_timeout=10s;

        # Reuse upstream connections. Without this, every proxied request pays
        # a TCP handshake, which at redirect volumes is pure waste.
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream frontend_backend {
        server frontend:8080 max_fails=2 fail_timeout=10s;
        keepalive 16;
    }

    # Shared proxy settings for the API.
    proxy_http_version 1.1;

    server {
        listen 80 default_server;
        server_name _;

        # X-Forwarded-For is APPENDED to, not replaced. The app reads the
        # client IP TRUSTED_PROXY_HOPS entries from the right, so a client that
        # sends its own X-Forwarded-For cannot forge its rate-limit identity.
        # $http_host, not $host: it keeps the port the client actually used, so
        # any absolute URL the app builds (and the short URLs it returns) point
        # back at a reachable address rather than the default port.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Request-ID      $req_id;
        proxy_set_header Connection        "";   # required for upstream keepalive

        proxy_connect_timeout 2s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;

        # Retry the other replica when one refuses or dies mid-request, but
        # never retry a request the upstream already began answering.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # Redirects must not be rewritten -- the Location header points at a
        # third-party destination, not at us.
        proxy_redirect off;

        # Emit RELATIVE Location headers for the 301s nginx generates itself
        # (for example /api -> /api/). With absolute_redirect on, nginx builds
        # the URL from $host plus its own listen port, which drops the
        # published port -- `/api` on localhost:8080 redirected to
        # http://localhost/api/ and broke. A relative Location is resolved by
        # the client against the origin it actually used, so this stays correct
        # behind any port mapping, proxy, or TLS terminator.
        absolute_redirect off;

        # -------------------------------------------------- load balancer ---
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        # -------------------------------------------------------- the API ---
        location ^~ /api/ {
            proxy_pass http://api_backend;
        }

        location = /health   { proxy_pass http://api_backend; access_log off; }
        location = /ready    { proxy_pass http://api_backend; access_log off; }
        location = /docs     { proxy_pass http://api_backend; }
        location = /redoc    { proxy_pass http://api_backend; }
        location = /openapi.json { proxy_pass http://api_backend; }
        location = /docs/oauth2-redirect { proxy_pass http://api_backend; }

        # Metrics are operational data (and would let anyone enumerate traffic
        # volumes), so they are reachable only from private networks: the
        # compose network, and the Docker gateway a host `curl` arrives from.
        # Prometheus itself scrapes api-1/api-2 directly, not through here.
        location = /metrics {
            access_log off;
            allow 127.0.0.0/8;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://api_backend;
        }

        # ------------------------------------------- redirect hot path ---
        # A bare single-segment path of 4-16 base62-ish characters is a short
        # code. Anything with a slash (e.g. /urls/aB3xY7z) is an SPA route and
        # falls through to the frontend.
        location ~ "^/[A-Za-z0-9_-]{4,16}$" {
            proxy_pass http://api_backend;
        }

        # ------------------------------------------------------ frontend ---
        location / {
            proxy_pass http://frontend_backend;
        }
    }
}
